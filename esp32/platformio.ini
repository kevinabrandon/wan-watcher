; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two environments share the same build:
;   esp32-poe-iso      upload over USB serial (first flash, or recovery)
;   esp32-poe-iso-ota  upload over the network to wan-watcher.local
;
; Both need WW_OTA_PASSWORD in the environment: it is compiled into the
; firmware (OTA is disabled if it is empty) and passed to espota on upload.

[env]
; Pinned: the code targets the arduino-esp32 2.0.x core shipped by the 6.x
; platform line. espressif32 7.x/8.x move to core 3.x, whose Ethernet API
; (ETH.begin signature, WiFiEvent_t) no longer matches main.cpp.
platform = espressif32@6.12.0
board = esp32-poe-iso
framework = arduino
board_build.filesystem = littlefs
extra_scripts = pre:extra_scripts/copy_docs.py
build_flags = -DOTA_PASSWORD=\"${sysenv.WW_OTA_PASSWORD}\"

lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit LED Backpack Library@^1.4.1
    bblanchon/ArduinoJson@^7
    LittleFS@^2.0.0

[env:esp32-poe-iso]

[env:esp32-poe-iso-ota]
upload_protocol = espota
upload_port = wan-watcher.local
upload_flags = --auth=${sysenv.WW_OTA_PASSWORD}
